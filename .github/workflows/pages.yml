name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The ONNX models of this Hugging Face revision are served with the app.
  MODEL_REPO: DevWorld/flattener
  MODEL_REVISION: "1.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Download models
        run: |
          base="https://huggingface.co/${MODEL_REPO}/resolve/${MODEL_REVISION}"
          for name in manifest.json dewarp.onnx gate.onnx orient.onnx; do
            curl -fsSL --retry 3 -o "public/models/${name}" "${base}/${name}"
          done
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("public/models/manifest.json", "utf8"));
            for (const [role, model] of Object.entries(manifest.models)) {
              const size = fs.statSync(`public/models/${model.file}`).size;
              if (size !== model.bytes) throw new Error(`${role}: ${size} bytes, expected ${model.bytes}`);
            }
            console.log(`models ${manifest.version}`);
          '
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
